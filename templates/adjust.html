{% extends 'base.html' %}{% block title %}Коригування{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">АДМІНІСТРУВАННЯ / ЗАЛИШКИ</p><h1>Коригування<span class="period">.</span></h1><p class="muted">Результати інвентаризації та виправлення обліку з обов’язковою причиною.</p></div></div><div class="form-page"><section class="panel form-panel"><div class="panel-head"><div><p class="eyebrow">НОВА ОПЕРАЦІЯ</p><h2>Змінити залишок партії</h2></div></div><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Партія *<select name="batch_id" required><option value="">Оберіть партію</option>{% for b in batches %}<option value="{{ b.id }}">{{ b.sku }} · {{ b.name }} / {{ b.code }} — {{ b.qty|qty }} {{ b.unit }}</option>{% endfor %}</select></label><label>Зміна кількості *<input name="quantity" type="number" step="0.001" required placeholder="Наприклад, -2 або 1,5"><small>Від’ємне число зменшує залишок, додатне — збільшує.</small></label><label>Причина *<textarea name="reason" required minlength="5" rows="3" placeholder="Результат інвентаризації, пошкодження тощо"></textarea></label><div class="modal-actions"><button class="btn primary">Провести коригування →</button></div></form></section></div>{% endblock %}
